<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Elina Mushroom Adventure</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <!-- =========================
         MAIN MENU
    ========================== -->
    <section id="menu">

        <div class="logo">
            <div class="logo-mushroom">🍄</div>

            <h1>ELINA</h1>

            <h2>MUSHROOM ADVENTURE</h2>

            <p>ماجراجویی الینا</p>
        </div>

        <div class="menu-buttons">

            <button id="startBtn">
                🎮 شروع بازی
            </button>

            <button id="levelsBtn">
                🌍 انتخاب دنیا
            </button>

            <button id="charsBtn">
                👧 شخصیت‌ها
            </button>

        </div>

        <p class="copyright">
            © Elina Mushroom Adventure
        </p>

    </section>


    <!-- =========================
         LEVEL / WORLD MENU
    ========================== -->
    <section id="levels" class="hidden">

        <button id="backFromLevels" class="back-button">
            ← بازگشت
        </button>

        <h2 class="menu-title">
            🌍 انتخاب دنیا
        </h2>

        <div id="levelList">

            <button class="world-card" data-world="1">
                <span class="world-icon">🌳</span>
                <span>دنیای جنگل</span>
                <small>WORLD 1</small>
            </button>

            <button class="world-card" data-world="2">
                <span class="world-icon">❄️</span>
                <span>دنیای برفی</span>
                <small>WORLD 2</small>
            </button>

            <button class="world-card" data-world="3">
                <span class="world-icon">🌊</span>
                <span>دنیای آب</span>
                <small>WORLD 3</small>
            </button>

            <button class="world-card" data-world="4">
                <span class="world-icon">🔥</span>
                <span>دنیای آتش</span>
                <small>WORLD 4</small>
            </button>

        </div>

    </section>


    <!-- =========================
         CHARACTERS
    ========================== -->
    <section id="characters" class="hidden">

        <button id="backFromCharacters" class="back-button">
            ← بازگشت
        </button>

        <h2 class="menu-title">
            👧 شخصیت‌ها
        </h2>

        <div class="character-list">

            <div class="character-card">
                <div class="character-icon">👧</div>
                <h3>الینا</h3>
                <p>قهرمان ماجراجویی</p>
                <span>⭐ شخصیت اصلی</span>
            </div>

        </div>

    </section>


    <!-- =========================
         GAME SCREEN
    ========================== -->
    <section id="gameScreen" class="hidden">

        <canvas id="gameCanvas"></canvas>


        <!-- HUD -->
        <div id="hud">

            <div class="hud-item">
                ❤️
                <span id="lives">3</span>
            </div>

            <div class="hud-item">
                🪙
                <span id="coins">0</span>
            </div>

            <div class="hud-item">
                ⭐
                <span id="score">0</span>
            </div>

            <div class="hud-item">
                🔫
                <span id="ammo">7</span>
            </div>

            <div class="hud-item">
                🌍
                <span id="world">1</span>
                -
                <span id="level">1</span>
            </div>

        </div>


        <!-- PAUSE -->
        <button id="pauseBtn" class="pause-button">
            ❚❚
        </button>


        <!-- MOBILE CONTROLS -->
        <div id="controls">

            <div class="left-controls">

                <button
                    id="left"
                    class="game-control"
                    type="button"
                >
                    ◀
                </button>

                <button
                    id="right"
                    class="game-control"
                    type="button"
                >
                    ▶
                </button>

            </div>


            <div class="right-controls">

                <button
                    id="jump"
                    class="game-control jump-control"
                    type="button"
                >
                    ⬆
                </button>

                <button
                    id="shoot"
                    class="game-control shoot-control"
                    type="button"
                >
                    ●
                </button>

            </div>

        </div>

    </section>


    <!-- =========================
         PAUSE MENU
    ========================== -->
    <section id="pauseMenu" class="overlay hidden">

        <div class="pause-box">

            <h2>
                ⏸ بازی متوقف شد
            </h2>

            <button id="resumeBtn">
                ▶ ادامه بازی
            </button>

            <button id="restartBtn">
                🔄 شروع دوباره
            </button>

            <button id="exitBtn">
                🏠 منوی اصلی
            </button>

        </div>

    </section>


    <!-- =========================
         GAME OVER
    ========================== -->
    <section id="gameOver" class="overlay hidden">

        <div class="pause-box">

            <h2>
                💔 بازی تمام شد
            </h2>

            <p>
                امتیاز:
                <strong id="finalScore">0</strong>
            </p>

            <button id="retryBtn">
                🔄 دوباره بازی کن
            </button>

            <button id="gameOverHome">
                🏠 منوی اصلی
            </button>

        </div>

    </section>


    <!-- =========================
         WIN MENU
    ========================== -->
    <section id="winMenu" class="overlay hidden">

        <div class="pause-box">

            <h2>
                🏆 پیروز شدی!
            </h2>

            <p>
                آفرین الینا! 🎉
            </p>

            <p>
                امتیاز:
                <strong id="winScore">0</strong>
            </p>

            <button id="nextBtn">
                🚩 مرحله بعد
            </button>

            <button id="winHomeBtn">
                🏠 منوی اصلی
            </button>

        </div>

    </section>


    <!-- پیام‌های بازی -->
    <div id="message"></div>

</div>


<!-- GAME JS -->
<script src="game.js"></script>

</body>
</html>
