<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>ELINA MUSHROOM ADVENTURE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         MAIN MENU
    ========================== -->
    <div id="mainMenu" class="menu">

        <div class="menu-content">

            <h1>🍄 ELINA</h1>
            <h2>MUSHROOM ADVENTURE</h2>

            <p class="subtitle">
                یک ماجراجویی هیجان‌انگیز در جنگل
            </p>

            <button id="startGame">
                ▶ شروع بازی
            </button>

            <button id="worldButton">
                🌍 انتخاب جهان
            </button>

            <button id="levelButton">
                ⭐ انتخاب مرحله
            </button>

        </div>

    </div>


    <!-- =========================
         WORLD MENU
    ========================== -->
    <div id="worldMenu" class="menu hidden">

        <div class="menu-content">

            <h2>🌍 انتخاب جهان</h2>

            <button data-world="1">
                🌲 جهان اول - جنگل
            </button>

            <button data-world="2">
                ❄️ جهان دوم - برف
            </button>

            <button data-world="3">
                🌊 جهان سوم - آب
            </button>

            <button data-world="4">
                🔥 جهان چهارم - آتش
            </button>

            <button id="backFromWorld">
                ↩ بازگشت
            </button>

        </div>

    </div>


    <!-- =========================
         LEVEL MENU
    ========================== -->
    <div id="levelMenu" class="menu hidden">

        <div class="menu-content">

            <h2>⭐ انتخاب مرحله</h2>

            <div id="levelButtons">

                <button data-level="1">مرحله 1</button>
                <button data-level="2">مرحله 2</button>
                <button data-level="3">مرحله 3</button>
                <button data-level="4">مرحله 4</button>
                <button data-level="5">مرحله 5</button>

                <button data-level="6">مرحله 6</button>
                <button data-level="7">مرحله 7</button>
                <button data-level="8">مرحله 8</button>
                <button data-level="9">مرحله 9</button>
                <button data-level="10">مرحله 10</button>

            </div>

            <button id="backFromLevel">
                ↩ بازگشت
            </button>

        </div>

    </div>


    <!-- =========================
         GAME SCREEN
    ========================== -->
    <div id="gameScreen" class="hidden">

        <canvas id="gameCanvas"></canvas>


        <!-- =====================
             HUD
        ====================== -->

        <div id="hud">

            <div id="score">
                امتیاز: <span id="scoreValue">0</span>
            </div>

            <div id="coins">
                🪙 <span id="coinValue">0</span>
            </div>

            <div id="bullets">
                🔫 <span id="bulletValue">7</span>
            </div>

            <div id="worldName">
                🌲 جنگل
            </div>

            <div id="levelName">
                مرحله 1
            </div>

        </div>


        <!-- =====================
             PAUSE BUTTON
        ====================== -->

        <button id="pauseButton">
            ⏸
        </button>


        <!-- =====================
             MOBILE CONTROLS
        ====================== -->

        <div id="mobileControls">

            <div class="movement-buttons">

                <button id="leftButton">
                    ◀
                </button>

                <button id="rightButton">
                    ▶
                </button>

            </div>

            <div class="action-buttons">

                <button id="jumpButton">
                    ⬆
                </button>

                <button id="shootButton">
                    🔫
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         PAUSE MENU
    ========================== -->

    <div id="pauseMenu" class="menu hidden">

        <div class="menu-content">

            <h2>⏸ بازی متوقف شد</h2>

            <button id="resumeButton">
                ▶ ادامه بازی
            </button>

            <button id="restartButton">
                🔄 شروع دوباره
            </button>

            <button id="pauseHomeButton">
                🏠 منوی اصلی
            </button>

        </div>

    </div>


    <!-- =========================
         GAME OVER
    ========================== -->

    <div id="gameOverMenu" class="menu hidden">

        <div class="menu-content">

            <h2>💥 بازی تمام شد!</h2>

            <p>
                امتیاز شما:
                <span id="finalScore">0</span>
            </p>

            <button id="retryButton">
                🔄 دوباره تلاش کن
            </button>

            <button id="gameOverHomeButton">
                🏠 منوی اصلی
            </button>

        </div>

    </div>


    <!-- =========================
         WIN MENU
    ========================== -->

    <div id="winMenu" class="menu hidden">

        <div class="menu-content">

            <h2>🎉 پیروز شدی!</h2>

            <p>
                مرحله با موفقیت تمام شد!
            </p>

            <p>
                امتیاز:
                <span id="winScore">0</span>
            </p>

            <button id="nextLevelButton">
                ▶ مرحله بعد
            </button>

            <button id="winHomeButton">
                🏠 منوی اصلی
            </button>

        </div>

    </div>


    <!-- =========================
         GAME JAVASCRIPT
    ========================== -->

    <script src="game.js"></script>

</body>
</html>
